buildscript {
    repositories {
        mavenCentral()
    }
}

// Apply groovy plugin to root buildSrc so we can use dependencies
apply plugin: "groovy"

subprojects {
    apply plugin: "groovy"

    it.repositories {
        mavenCentral()
    }

    it.dependencies {
        // These should really be under the projects themselves,
        // but when building on travis
        // the per project dependencies didn't seem to
        // get picked up. We only have one buildSrc plugin
        // so it doesn't really matter, but if we ever get more
        // we should figure this out
        implementation  'org.codehaus.groovy:groovy-all:3.0.22'
        implementation  gradleApi()
        implementation  "org.yaml:snakeyaml:2.2"
    }
}

repositories {
    mavenCentral()
}

// Add plugin subprojects to root buildSrc classpath
// This makes plugin classes (like TaskHelper) available to main build scripts
dependencies {
    implementation project(':plugins')
}

