            } else {
                resValue "string", "io.fabric.ApiKey", fabric_key
                resValue "bool", "com.crashlytics.RequireBuildId", "false"
            }
        }
        def branchKey = ""
        if (fabric != null) {
            def kits = fabric.get('KITS')
            if (null != kits) {
                def branch = kits.get('BRANCH')
