android.enableJetifier=true
android.useAndroidX=true
org.gradle.jvmargs=-Xmx2048M --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED
kotlin.daemon.jvmargs=-Xmx2048M --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
# Enable Gradle configuration cache for better build performance
org.gradle.configuration-cache=true
# Enable parallel execution
org.gradle.parallel=true
# Enable daemon for faster builds
org.gradle.daemon=true
kapt.compiler.jvmargs=--add-opens=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
# Force KAPT to run in Gradle's JVM (JDK 17) instead of a separate Kotlin daemon using JAVA_HOME (JDK 21)
kapt.use.worker.api=false
